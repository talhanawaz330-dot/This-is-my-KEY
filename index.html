<!DOCTYPE html>
<html lang="hi"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Magic Studio - $1 Payment</title><script src="https://cdn.tailwindcss.com"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body class="bg-black text-white">
<div class="max-w-xl mx-auto p-4">
<h1 class="text-3xl font-bold text-center mt-4">AI Magic Studio 💰</h1>
<p class="text-center text-white/60 text-xs mt-1">Pay $1 & Generate - International Payment</p>

<div class="grid grid-cols-3 gap-2 mt-6">
<div class="bg-zinc-900 border border-purple-500 rounded-xl p-3 text-center ring-2 ring-purple-500/20">
<p class="text-xs text-white/60">1 Video</p><p class="font-bold text-xl">$1</p><p class="text-[10px] text-yellow-300">Most Popular</p>
</div>
<div class="bg-zinc-900 border border-white/10 rounded-xl p-3 text-center">
<p class="text-xs text-white/60">5 Videos</p><p class="font-bold text-xl">$4</p><p class="text-[10px] text-green-400">Save $1</p>
</div>
<div class="bg-zinc-900 border border-white/10 rounded-xl p-3 text-center">
<p class="text-xs text-white/60">10 Videos</p><p class="font-bold text-xl">$7</p><p class="text-[10px] text-green-400">Best Value</p>
</div>
</div>

<div class="bg-zinc-900 rounded-2xl p-4 mt-6 border border-white/10">
<input type="file" id="fileInput" accept="image/*" class="w-full text-sm file:mr-3 file:bg-white file:text-black file:px-4 file:py-2 file:rounded-full file:border-0" onchange="previewFile()">
<img id="preview" class="hidden w-full mt-4 rounded-xl max-h-[400px] object-contain border border-white/10">
<textarea id="promptInput" rows="3" placeholder="Prompt: Ghibli style, dance video, cinematic zoom..." class="w-full mt-4 bg-black border border-white/20 rounded-xl p-3 text-sm"></textarea>

<div id="paySection" class="mt-5">
<p class="text-xs text-center text-yellow-300 mb-2">🔒 Pay $1 to generate video:</p>
<button onclick="payNow(1)" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 py-4 rounded-full font-bold text-lg">💳 Pay $1 & Generate</button>
<p class="text-[10px] text-center text-white/30 mt-2">International Card, PayPal, UPI - All supported</p>
</div>

<button id="genBtn" onclick="generateAI()" class="hidden w-full mt-5 bg-gradient-to-r from-purple-600 to-pink-600 py-4 rounded-full font-bold">✨ Generate Magic (Paid)</button>

<div id="resultArea" class="hidden mt-6 bg-black p-4 rounded-xl border border-white/10">
<p id="loader" class="text-center text-sm">Video ban raha hai... 40 sec...</p>
<video id="resultVideo" controls class="hidden w-full rounded-xl mt-3"></video>
<a id="downloadBtn" class="hidden mt-3 block text-center bg-white text-black py-3 rounded-full font-bold text-sm">⬇️ Download Video</a>
<p id="error" class="hidden text-red-400 text-xs mt-2"></p>
</div>
</div>

<div class="mt-8 bg-zinc-900 rounded-xl p-3 border border-white/10">
<p class="text-xs font-bold">⚙️ ADMIN SETUP:</p>
<input id="rzpKey" type="text" placeholder="Razorpay Key ID - rzp_live_XXXXX" class="w-full mt-2 p-2 rounded bg-black border text-xs">
<input id="falKey" type="text" placeholder="Fal.ai Secret Key" class="w-full mt-2 p-2 rounded bg-black border text-xs">
<button onclick="saveConfig()" class="mt-2 w-full bg-white text-black py-2 rounded font-bold text-xs">Save Config</button>
<p id="configStatus" class="text-[10px] text-green-400 mt-1 hidden">Saved! ✅</p>
</div>
</div>

<script>
let base64Image = ""; let isPaid = false;
let RAZORPAY_KEY = localStorage.getItem('rzp_key') || "";
let FAL_KEY = localStorage.getItem('fal_secret') || "";
if(RAZORPAY_KEY) document.getElementById('rzpKey').value = RAZORPAY_KEY;
if(FAL_KEY) document.getElementById('falKey').value = FAL_KEY;

function saveConfig(){
 const rk = document.getElementById('rzpKey').value.trim();
 const fk = document.getElementById('falKey').value.trim();
 if(rk) localStorage.setItem('rzp_key', rk);
 if(fk) localStorage.setItem('fal_secret', fk);
 RAZORPAY_KEY = rk; FAL_KEY = fk;
 document.getElementById('configStatus').classList.remove('hidden');
 alert("Config saved!");
}
function previewFile(){
 const file = document.getElementById('fileInput').files[0];
 if(!file) return;
 const r = new FileReader();
 r.onload = e => { base64Image = e.target.result; document.getElementById('preview').src = base64Image; document.getElementById('preview').classList.remove('hidden'); };
 r.readAsDataURL(file);
}

function payNow(dollars){
 const rzpKey = document.getElementById('rzpKey').value.trim() || localStorage.getItem('rzp_key');
 if(!rzpKey || !rzpKey.startsWith('rzp_')){
   alert("Test Mode: Razorpay key nahi hai, bina pay ke allow kar raha hu");
   isPaid = true;
   document.getElementById('paySection').classList.add('hidden');
   document.getElementById('genBtn').classList.remove('hidden');
   return;
 }
 const options = {
  key: rzpKey,
  amount: dollars*100,
  currency: "USD",
  name: "AI Magic Studio",
  description: dollars + " USD - 1 AI Video",
  handler: function (response){
    isPaid = true;
    document.getElementById('paySection').classList.add('hidden');
    document.getElementById('genBtn').classList.remove('hidden');
    alert("Payment Successful! $" + dollars + " - ID: " + response.razorpay_payment_id);
  },
  theme: { color: "#9333ea" }
 };
 const rzp = new Razorpay(options);
 rzp.open();
}

async function generateAI(){
 if(!isPaid){ alert("Pehle $1 pay karo!"); return; }
 const prompt = document.getElementById('promptInput').value.trim();
 const falKey = document.getElementById('falKey').value.trim() || localStorage.getItem('fal_secret');
 if(!falKey){ alert("Admin: Fal key dalo"); return; }
 if(!base64Image){ alert("Photo upload karo"); return; }
 if(!prompt){ alert("Prompt likho"); return; }

 document.getElementById('resultArea').classList.remove('hidden');
 document.getElementById('loader').classList.remove('hidden');
 document.getElementById('loader').innerText="Payment $1 verified ✅ Video ban raha hai... 40 sec";
 document.getElementById('genBtn').innerText="Bana raha hu...";

 try{
   const genRes = await fetch('https://queue.fal.run/fal-ai/kling-video/v2.1/standard/image-to-video', {
     method: 'POST', headers: { 'Authorization': 'Key ' + falKey, 'Content-Type': 'application/json' },
     body: JSON.stringify({ prompt: prompt, image_url: base64Image, duration: "5", aspect_ratio: "16:9" })
   });
   if(!genRes.ok){ const t = await genRes.text(); throw new Error(t.slice(0,300)); }
   const genData = await genRes.json();
   let statusUrl = genData.response_url || genData.status_url;
   if(!statusUrl && genData.request_id) statusUrl = `https://queue.fal.run/fal-ai/kling-video/v2.1/standard/image-to-video/requests/${genData.request_id}/status`;
   let videoUrl = null;
   for(let i=0;i<50;i++){
     await new Promise(r=>setTimeout(r,3000));
     const sRes = await fetch(statusUrl, { headers: { 'Authorization': 'Key ' + falKey } });
     const sData = await sRes.json();
     if(sData.status === 'COMPLETED'){ videoUrl = sData.response?.video?.url || sData.video?.url; if(videoUrl) break; }
     document.getElementById('loader').innerText=`Ban raha hai... ${ (i+1)*3 } sec ⏳`;
   }
   if(!videoUrl) throw new Error("Fal dashboard me check karo");
   document.getElementById('loader').classList.add('hidden');
   const v = document.getElementById('resultVideo'); v.src = videoUrl; v.classList.remove('hidden');
   document.getElementById('downloadBtn').href = videoUrl; document.getElementById('downloadBtn').classList.remove('hidden');
   document.getElementById('genBtn').innerText="✨ Generate Magic";
   isPaid = false; document.getElementById('paySection').classList.remove('hidden'); document.getElementById('genBtn').classList.add('hidden');
 }catch(e){
   document.getElementById('loader').classList.add('hidden');
   document.getElementById('error').classList.remove('hidden');
   document.getElementById('error').innerText = e.message;
   document.getElementById('genBtn').innerText="✨ Generate Magic";
 }
}
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
